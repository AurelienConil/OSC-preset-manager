<!doctype html>
<!-- Role: Vite HTML entry point. Mounts the Vue app on #app.
     No webfont link on purpose: a packaged Electron app can run offline, so
     the font stack falls back to the system UI font (see --app-font). -->
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Template Electron</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
